# ─────────────────────────────────────────────────────────────────────────────
# Lint — Dedicated ESLint workflow
#
# Runs on:
#   • Every PR targeting main / develop / staging
#   • Direct pushes to main / develop
#
# Kept separate from ci.yml so lint failures are immediately surfaced
# as a distinct check in the PR status.
# ─────────────────────────────────────────────────────────────────────────────

name: Lint

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint
